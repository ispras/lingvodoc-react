<!DOCTYPE html>
<html>

<head>
  <title>Lingvodoc</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta charset="utf-8">
  <meta name="description" content="">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
</head>

<body>
  <div id="root"></div>
  <!-- Voiceflow agent -->
  <script type="text/javascript">
    (async function(d, t) {
      const widget = "https://cdn.voiceflow.com/widget/bundle.mjs";
      const timeout = 2000;
      try {
        const res = await fetch(widget, { signal: AbortSignal.timeout(timeout) });
        const result = await res.blob();

        var v = d.createElement(t), s = d.getElementsByTagName(t)[0];
        v.onload = function() {
          window.voiceflow.chat.load({
            verify: { projectID: '6713e67f3b38507f5163c395' },
            url: 'https://general-runtime.voiceflow.com',
            versionID: 'production'
          });
        }
        v.src = widget;
        v.type = "text/javascript";
        s.parentNode.insertBefore(v, s);
      }
      catch (err) {
        if (err.name === "TimeoutError") {
          // This exception is from the abort signal
          console.error(`Timeout: It took more than ${timeout} milliseconds to fetch ${widget}`);
        } else {
          // A network error, or some other problem.
          console.error(`Error: type: ${err.name}, message: ${err.message}`);
        }
      }
    })(document, 'script');
  </script>
  <!-- /Voiceflow agent -->
</body>

</html>
